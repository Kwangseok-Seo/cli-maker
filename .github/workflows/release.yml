# 태그를 밀면 크로스 컴파일한 바이너리를 릴리스에 붙인다.
#
# M12d 에서 손으로 하던 절차를 그대로 옮긴 것이고, 옮긴 이유가 둘 있다. Windows 에서
# 만든 tar 는 바이너리에 실행 비트가 안 붙고(Git Bash 의 chmod 가 NTFS 에서 안 먹는다),
# GNU tar 가 `C:` 를 원격 호스트로 읽어 --force-local 이 필요했다. 리눅스 러너에서는
# 둘 다 문제가 아니다.
name: release

on:
  push:
    tags: ['v*']
  # 태그를 새로 파지 않고 시험하기 위한 입구. 이때는 릴리스를 만들지 않고
  # artifact 까지만 올린다 (아래 release step 의 if 참조).
  workflow_dispatch:

# 이걸 적지 않으면 GITHUB_TOKEN 이 repo 기본값인 read 로 발급돼 릴리스 생성이 403 이다.
# 여기 적은 것 외의 모든 권한(issues·packages·actions …)은 none 이 된다.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # action 은 태그로 참조한다 — 태그는 옮길 수 있으므로 저자를 신뢰한다는 뜻이다.
      # 공급망을 좁히려면 40자리 커밋 SHA 로 고정한다.
      - uses: actions/checkout@v7
        with:
          # 기본값(얕은 체크아웃)이면 태그가 안 와서 Go 가 "태그 없는 repo" 로 보고
          # v0.0.0-... 을 만든다 (실측: run 30748249635). 버전 계산에 직전 태그와
          # 거기까지의 거리가 필요하므로 전체 히스토리를 가져온다.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # 버전을 여기 적지 않고 go.mod 에게 묻는다. 적어 두면 go.mod 를 올릴 때
          # 이 파일이 조용히 뒤처진다.
          go-version-file: go.mod

      - name: 테스트
        run: go test ./...

      - name: 크로스 컴파일 + 서드파티 고지
        env:
          # 태그로 트리거되면 태그 이름, workflow_dispatch 면 브랜치 이름이 온다.
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          main=$(go list -m)

          # 고지를 플랫폼마다 따로 만든다.
          #
          # Go 는 정적 링크라 바이너리 하나에 의존성 코드가 들어간다. 그 파일을 배포하는
          # 순간 각 라이선스의 고지 조건이 켜진다 (소스만 줄 때는 안 켜진다).
          #
          # 한 번만 만들어 전 플랫폼에 넣으면 틀린다 — go list -deps 는 현재 GOOS 기준으로
          # 답하고, 실제로 갈린다: mousetrap 은 cobra 가 windows 에서만 쓰므로 리눅스에서
          # 물으면 안 나온다. 그렇게 만든 windows 아카이브는 링크된 코드의 고지를 빠뜨린다
          # (실측: run 30748888749 가 3개만 수집했다).
          #
          # 모듈 이름은 어디에도 적지 않는다. 손으로 적으면 의존성이 바뀔 때 조용히
          # 뒤처지고, 그 조용함이 곧 조건 위반이다. -deps 는 실제로 링크되는 것만 보고하므로
          # go.mod 에만 있는 테스트용 의존성(blackfriday·check.v1)은 저절로 빠진다.
          #
          # go-licenses 를 쓰지 않은 이유: yaml.v3 를 MIT 로만 판정해 NOTICE 를 놓쳤다.
          # 그 모듈은 MIT + Apache-2.0 이고 Apache-2.0 §4(d) 가 NOTICE 전달을 요구한다.
          # 파일을 그대로 싣는 쪽은 판정을 하지 않으므로 그런 실수를 할 수 없다.
          notices() {
            out=$1
            {
              echo "# 서드파티 고지"
              echo
              echo "이 바이너리(\`${GOOS}/${GOARCH}\`)에는 아래 오픈소스가 정적 링크되어 있습니다."
              echo "각 저작권자와 라이선스 전문을 그대로 싣습니다. 목록은 빌드 시"
              echo "\`GOOS=${GOOS} GOARCH=${GOARCH} go list -deps\` 가 보고한 실제 링크 대상에서"
              echo "생성되므로, 의존성이 바뀌면 함께 바뀝니다."
              echo
            } > "$out"

            # 파이프 대신 리다이렉션으로 읽는다 — 파이프의 while 은 서브셸이라 exit 이
            # 이 step 을 멈추지 못한다.
            go list -deps -f '{{if not .Standard}}{{.Module.Path}}|{{.Module.Version}}|{{.Module.Dir}}{{end}}' . \
              | sort -u > mods.txt
            while IFS='|' read -r path ver dir; do
              [ "$path" = "$main" ] && continue
              [ -z "$dir" ] && continue
              { echo "## $path $ver"; echo; } >> "$out"
              found=0
              for f in "$dir"/LICEN[CS]E* "$dir"/NOTICE*; do
                [ -f "$f" ] || continue
                { echo "### $(basename "$f")"; echo; echo '```'; cat "$f"; echo '```'; echo; } >> "$out"
                found=1
              done
              if [ "$found" = 0 ]; then
                echo "::error::$path 의 라이선스 파일을 못 찾았다 — 손으로 확인해야 한다"
                exit 1
              fi
              echo "  고지: $path $ver"
            done < mods.txt
          }

          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            stage="stage/${GOOS}_${GOARCH}"
            mkdir -p "$stage"
            echo "== $GOOS/$GOARCH"
            go build -trimpath -ldflags "-s -w" -o "$stage/cli-maker$ext" .
            notices "$stage/THIRD-PARTY-NOTICES.md"
            cp LICENSE README.md "$stage/"
            if [ "$GOOS" = windows ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/cli-maker_${VERSION}_${GOOS}_${GOARCH}.zip" ./*)
            else
              tar -czf "dist/cli-maker_${VERSION}_${GOOS}_${GOARCH}.tar.gz" \
                -C "$stage" cli-maker LICENSE README.md THIRD-PARTY-NOTICES.md
            fi
          done
          (cd dist && sha256sum cli-maker_* > checksums.txt)
          ls -la dist

      - name: 버전이 박혔는지 확인
        run: |
          set -euo pipefail
          # 러너가 linux/amd64 이므로 그 바이너리는 여기서 실행된다.
          V=$(./stage/linux_amd64/cli-maker --version)
          echo "$V"
          # 두 가지 실패를 가른다. (devel) 은 vcs 스탬핑 자체가 없는 것 — M12d 에서
          # git worktree 로 빌드했을 때 그랬다. v0.0.0- 은 스탬핑은 됐는데 태그를 못 본
          # 것이다 — 얕은 체크아웃에서 실제로 나왔고(run 30748249635), (devel) 만 보던
          # 첫 판이 이걸 통과시켰다. 버전이 틀린 바이너리가 릴리스에 붙는 것보다 실패가 낫다.
          case "$V" in
            *'(devel)'*)
              echo "::error::vcs 스탬핑이 안 됐다 — .git 이 없거나 worktree 일 수 있다"
              exit 1 ;;
            *' v0.0.0-'*)
              echo "::error::태그를 못 봤다 — checkout 의 fetch-depth 를 확인하라"
              exit 1 ;;
          esac
          # 태그로 트리거됐다면 태그 이름과 정확히 같아야 한다.
          if [ "${GITHUB_REF_TYPE:-}" = tag ] && ! echo "$V" | grep -qF "$GITHUB_REF_NAME"; then
            echo "::error::태그는 $GITHUB_REF_NAME 인데 바이너리는 $V"
            exit 1
          fi

      - name: 아카이브 확인
        run: |
          set -euo pipefail
          # M12d 에서 Windows 로 만든 첫 tar 가 -rw-r--r-- 였다. 아카이브 생성은
          # 성공한 것처럼 보이므로 열어 봐야만 안다.
          mode=$(tar -tzvf dist/cli-maker_*_linux_amd64.tar.gz | awk '$NF=="cli-maker"{print $1}')
          echo "실행 비트: $mode"
          case "$mode" in
            -rwx*) ;;
            *) echo "::error::실행 비트가 없다: $mode"; exit 1 ;;
          esac

          # 고지가 실제로 아카이브 안에 있어야 조건이 충족된다. 만들어 놓고 안 넣으면
          # 만들지 않은 것과 같다.
          tar -tzf dist/cli-maker_*_linux_amd64.tar.gz | grep -q '^THIRD-PARTY-NOTICES.md$' || {
            echo "::error::서드파티 고지가 아카이브에 없다"; exit 1; }

          # 고지가 플랫폼마다 다르게 만들어졌는지 못 박는다. mousetrap 은 windows 에만
          # 링크되므로, 양쪽이 같다면 한 번만 만들어 전부에 복사한 것이고 windows 쪽이 틀렸다.
          unzip -p dist/cli-maker_*_windows_amd64.zip THIRD-PARTY-NOTICES.md | grep -q mousetrap || {
            echo "::error::windows 고지에 mousetrap 이 없다 — 링크된 코드의 고지가 빠졌다"; exit 1; }
          if tar -xzOf dist/cli-maker_*_linux_amd64.tar.gz THIRD-PARTY-NOTICES.md | grep -q mousetrap; then
            echo "::error::linux 고지에 mousetrap 이 있다 — 플랫폼별로 만들어지지 않았다"
            exit 1
          fi
          echo "고지: windows 에만 mousetrap 있음 — 플랫폼별 생성 확인"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: 릴리스에 붙인다
        # 태그로 트리거됐을 때만. workflow_dispatch 는 위 artifact 까지만 하고 끝난다.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
