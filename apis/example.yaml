# Manifest: 하나의 web API 를 CLI 로 노출하기 위한 정의. (스키마 = M2 확정)
# 컬렉션(commands, params)은 name 필드를 가진 "순서 있는 리스트"다 — 이름을 키로 삼는 map 이 아니라.
#   근거: --help 순서를 유저가 적은 대로 보존 + Command/Param 이 자기 이름을 품는 self-contained 객체.
name: petstore
baseUrl: https://petstore3.swagger.io/api/v3

# 인증: 이 API 의 pet 조회는 익명으로 된다 — auth 블록 없음.
#   토큰이 필요한 API 의 예시는 github.yaml 참고 (매니페스트엔 비밀이 아니라 "어느 환경변수를 볼지"만 담는다).

# Command: 유저가 CLI 에서 호출할 동작.
#   예) cli-maker petstore getPetById --petId 10
commands:
  - name: getPetById
    method: GET
    path: /pet/{petId}
    params:
      - name: petId
        in: path
        type: int
        required: true
  - name: findByStatus
    method: GET
    path: /pet/findByStatus
    params:
      - name: status
        in: query
        type: string
